<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Universe</title>
    <link rel="stylesheet" href="../CSS/styles.css">

</head>

<body>
    <header>
        <section>
            <!-- Use red background -->
            <!-- logo image and buttons both centered  -->
            <img src="../CSS/2.png" alt="Marvel logo">
            <button>SIGN UP TO BE A PARTNER</button>
            <button>SIGN UP FOR A BUSINESS ACCOUNT</button>
        </section>

        <section>
            <!-- Image on left just like logo png and on next line AND BLACK BUTTON OUTLINE-->
            <img src="../CSS/p.png" alt="Spidermanart">
            <div>
                <label for="search">Search: </label>
                <input type="search" placeholder="Search for spiderman movies, shows, and more" name="search">
            </div>

            <div>
                <!-- THE LOG IN BUTTON SHOULD HAVE A BLACK TEXT-->
                <button>lOG IN</button>
                <!-- THE SIGN UP BUTTON SHOULD HAVE A RED BACKGROUND  AND WHITE TEXT-->
                <button>Sign Up</button>
                <!-- STYLE THE INPUT AND LABEL NICELY TO FIT THE THEME -->
            </div>


            <!-- FINAL NOTE: ALL THE BUTTONS AND IMAGES LABELS ARE TO BE IN ONE SEPARATE ROW LIKE PARNTER ETC BUTTON ROW -->
        </section>

    </header>
    <main>
        <h1>
            <div>
                <label for="select">Select the phase: </label>
                <select name="select" id="select">
                    <option value="" disabled selected>Select a phase</option>
                    <option value="phase1.html">Phase 1</option>
                    <option value="phase2.html">Phase 2</option>
                    <option value="phase3.html">Phase 3</option>
                    <option value="phase4.html">Phase 4</option>
                    <option value="phase5.html">Phase 5</option>
                    <option value="phase6.html">Phase 6</option>

                </select>
            </div>

        </h1>
    </main>
    <footer>
        <script src="../js/script.js"></script>
    </footer>
</body>

</html>
